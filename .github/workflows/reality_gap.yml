name: Reality Gap Score (daily)

on:
  schedule:
    # 23:30 UTC Sun–Thu = 08:30 KST Mon–Fri (UTC+9)
    - cron: '30 23 * * 0,1,2,3,4'
  workflow_dispatch: # 수동 트리거 허용

permissions:
  contents: write

jobs:
  reality-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy plotly

      - name: Run Reality Gap engine
        run: |
          echo "Reality Gap 스캔 시작 (시도 1)..."
          if python reality_gap.py; then
            echo "성공"
          else
            echo "실패 — 60초 후 재시도"
            sleep 60
            echo "Reality Gap 스캔 (시도 2)..."
            python reality_gap.py || { echo "재시도 실패: $?"; exit 1; }
          fi

      - name: Verify output
        shell: python
        run: |
          import json, sys, os

          path = "static/reality_gap.json"
          if not os.path.exists(path):
              print("ERROR: reality_gap.json 생성 실패")
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          n = data.get("total_stocks", 0)
          if n < 30:
              print(f"ERROR: 계산된 종목 너무 적음 ({n}종)")
              sys.exit(1)
          pos = data.get("summary", {}).get("positive_count", 0)
          neg = data.get("summary", {}).get("negative_count", 0)
          print(f"SUCCESS: {data.get('generated_at_kst','')} — {n}종 계산, positive {pos} / negative {neg}")

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f static/reality_gap.json
          git diff --staged --quiet || (
            git commit -m "Auto-update reality gap [$(date -u '+%Y-%m-%d %H:%M UTC')]" &&
            git pull --rebase &&
            git push
          )